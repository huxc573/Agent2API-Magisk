name: build

# 上游一发新版 → 自动抽运行体、打包、发 Release。
# 版本号：YY.MM.DD_x（北京时间当天第 x 个包），versionCode = YYMMDD*100+x。
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: '上游 tag（留空＝自动取最新，例如 3.3.0-beta.4）'
        required: false
      force:
        description: '上游没变也强出一个新包'
        type: boolean
        default: false
  schedule:
    # 每小时查一次上游（cron 是 UTC，`:30` 即北京每小时的第 30 分）。
    # 注意 GitHub 的 schedule 是尽力而为：会排队延迟甚至丢跑，所以这里只当作「轮询」，
    # 不承诺准点；要立刻出包用 workflow_dispatch（可勾 force）。
    - cron: '30 * * * *'

permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 qemu（为了在 amd64 runner 上跑 arm64 镜像里的小脚本）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 解析上游版本
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash scripts/ci/upstream.sh "${{ inputs.upstream }}"

      - name: 算本次版本号
        id: ver
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Shanghai date +%y.%m.%d)
          used=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true)
          # 取「已有最大序号 + 1」，不是「第一个空位」：删过旧 Release 后空位会重号
          last=$(printf '%s\n' "$used" | sed -n "s|^v${today}_\([0-9]\{1,\}\)$|\1|p" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          v="${today}_${n}"
          echo "本次版本: v$v（versionCode $((10#${today//./} * 100 + n))）"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 抽取运行体
        id: rt
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/rootfs.sh "${{ steps.up.outputs.tag }}"

      - name: 打包
        if: steps.up.outputs.skip != '1'
        env:
          AG2A_SELF_REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ steps.up.outputs.tag }}
        run: python3 build_module.py "${{ steps.ver.outputs.version }}"

      - name: 发 Release
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          UP: ${{ steps.up.outputs.tag }}
          PRE: ${{ steps.up.outputs.prerelease }}
        run: |
          set -euo pipefail
          zip="publish/Agent2API-Magisk-v${V}.zip"
          # 说明里直接写「本模块改了什么 + 上游这版改了什么」：上游常常只有 tag 不发 Release，
          # 甚至事后删 tag，只放链接的话点开就是 404，谁也看不出更新了啥。
          bash scripts/ci/notes.sh "$V" "$UP" "$zip" "${{ steps.rt.outputs.src }}" "${{ steps.rt.outputs.image }}" "${{ steps.rt.outputs.bin_sha256 }}"
          # 预发/正式跟随上游那个 release：上游是 beta 我们就标 Pre-release，
          # 上游转正（如 3.4.0）我们也发正式版，正式版才会占用 Latest。
          # 查不到上游标记时 upstream.sh 兜底给 prerelease=1，宁可不转正。
          if [ "${PRE:-1}" = "0" ]; then
              echo "上游已是正式版 → 本包按正式版发"
              gh release create "v$V" "$zip" --title "$V" --notes-file notes.md
          else
              echo "上游是预览版 → 本包按 Pre-release 发"
              gh release create "v$V" "$zip" --title "$V" --notes-file notes.md --prerelease
          fi
          # 顺带把这一版的 changelog.txt 挂成 asset：上游没变、只改内容而重出包时，
          # 后面那步要把它逐字沿用，不能靠「重新生成」（重新生成会按当前 CHANGELOG 取错小节）。
          gh release upload "v$V" changelog.txt --clobber

      - name: 写 update.json + 记账（UPSTREAM）
        if: steps.up.outputs.skip != '1'
        env:
          UP: ${{ steps.up.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          zip="publish/Agent2API-Magisk-v${V}.zip"
          # 管理器（Magisk / KernelSU / APatch）靠 module.prop 的 updateJson 拉这个文件，
          # 比较其中的 versionCode 决定是否显示「更新」。所以两者必须永远指向同一个 zip。
          # version / versionCode 直接从打好的包里读，杜绝手抄错位。
          ver=$(unzip -p "$zip" module.prop | sed -n 's/^version=//p' | cut -d' ' -f1)
          vc=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p')
          # 资产直链走 gh-proxy 镜像：国内直连 github.com/releases/download 基本拉不动，
          # 管理器点了「更新」也下不下来。要直连的话把 GH_PROXY 置空即可。
          GH_PROXY="https://gh-proxy.com/"
          # changelog 必须是**纯文本**直链：指向 github.com/…/blob/… 时管理器抓到的是整页
          # HTML（字符集 meta、<link> 一堆），显示成一坨乱码。
          # 走 GitHub Pages（源＝main 根目录）：raw.githubusercontent 国内基本连不上，
          # Pages 直连可用。仓库 Pages 需在 main 根目录开启，否则这里 404。
          pages="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          # changelog 只放**本次这一版**的说明，不要把整个 CHANGELOG.md 塞过去：
          # 管理器那个框是逐行滚的纯文本，几百行历史在里面既难看又没法定位；
          # 而且 CHANGELOG 里难免混着给开发者看的过程说明，不该出现在用户面前。
          # 取法：CHANGELOG 里第一小节（最新一版）的正文，去掉标题、空行与 markdown 粗体标记。
          awk 'BEGIN{n=0} /^## /{n++; if(n==2) exit} n==1' CHANGELOG.md \
            | sed '1d' | sed 's/^[[:space:]]*//' | sed '/^$/d' \
            | sed 's/\*\*//g' > changelog.txt || true
          # 上游没变（force 重出包）时，本次生成的说明会拿错 CHANGELOG 小节，且上游段落
          # 可能是空的 —— 直接沿用上一版 Release 里挂着的那份，保证管理器里看到的是
          # 「当时这一版到底改了什么」。
          if [ "$UP" = "$(cat UPSTREAM 2>/dev/null | tr -d ' \r\n')" ]; then
            prev=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName -q '.[].tagName' 2>/dev/null \
                   | grep -v "v${V}$" | head -1 || true)
            if [ -n "$prev" ]; then
              if gh release download "$prev" -R "$GITHUB_REPOSITORY" -p changelog.txt -O changelog.prev --clobber 2>/dev/null && [ -s changelog.prev ]; then
                echo "上游未变，沿用 $prev 的 changelog.txt（$(wc -l < changelog.prev) 行）"
                mv changelog.prev changelog.txt
              fi
            fi
          fi
          if [ ! -s changelog.txt ]; then
            echo "运行体 $UP；本版说明见 Releases 页。" > changelog.txt
          fi
          echo "（上游运行体 $UP）" >> changelog.txt
          cat > update.json <<EOF
          {
            "version": "$ver",
            "versionCode": $vc,
            "zipUrl": "${GH_PROXY}${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${V}/$(basename "$zip")",
            "changelog": "$pages/changelog.txt"
          }
          EOF
          echo "$UP" > UPSTREAM
          echo "$ver" > LAST_VERSION
          echo "${{ steps.up.outputs.finger }}" > LAST_FINGER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPSTREAM update.json changelog.txt LAST_VERSION LAST_FINGER
          # 上游没变时（force 出包）UPSTREAM 可能没 diff，但 update.json 一定变了；
          # 两个都没变才跳过，别让 git commit 以 1 退出
          if git diff --cached --quiet; then
            echo "UPSTREAM / update.json 都没变，跳过提交"
            exit 0
          fi
          git commit -m "chore: 发布 v$V（上游 $UP）"
          git push

      - name: 没有新版
        if: steps.up.outputs.skip == '1'
        run: echo "上游仍是 ${{ steps.up.outputs.tag }}，跳过。要强制出包请勾 force。"
