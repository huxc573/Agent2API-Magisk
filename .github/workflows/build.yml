name: build

# 上游一发新版 → 自动抽运行体、打包、发 Release。
# 版本号：YY.MM.DD_x（北京时间当天第 x 个包），versionCode = YYMMDD*100+x。
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: '上游 tag（留空＝自动取最新，例如 3.3.0-beta.4）'
        required: false
      force:
        description: '上游没变也强出一个新包'
        type: boolean
        default: false
  schedule:
    # 每小时查一次上游（cron 是 UTC，`:30` 即北京每小时的第 30 分）。
    # 注意 GitHub 的 schedule 是尽力而为：会排队延迟甚至丢跑，所以这里只当作「轮询」，
    # 不承诺准点；要立刻出包用 workflow_dispatch（可勾 force）。
    - cron: '30 * * * *'

permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 qemu（为了在 amd64 runner 上跑 arm64 镜像里的小脚本）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 解析上游版本
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash scripts/ci/upstream.sh "${{ inputs.upstream }}"

      - name: 算本次版本号
        id: ver
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Shanghai date +%y.%m.%d)
          used=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true)
          # 取「已有最大序号 + 1」，不是「第一个空位」：删过旧 Release 后空位会重号
          last=$(printf '%s\n' "$used" | sed -n "s|^v${today}_\([0-9]\{1,\}\)$|\1|p" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          v="${today}_${n}"
          echo "本次版本: v$v（versionCode $((10#${today//./} * 100 + n))）"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 抽取运行体
        if: steps.up.outputs.skip != '1'
        run: bash scripts/ci/rootfs.sh "${{ steps.up.outputs.tag }}"

      - name: 打包
        if: steps.up.outputs.skip != '1'
        env:
          AG2A_SELF_REPO: ${{ github.repository }}
        run: python3 build_module.py "${{ steps.ver.outputs.version }}"

      - name: 发 Release
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          UP: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          zip="publish/Agent2API-Magisk-v${V}.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          cat > notes.md <<EOF
          模块版本 **$V**，打包的上游运行体 **$UP**（从官方镜像 \`aimodcc/agent2api\` 原样抽取）。

          - 大小 $(du -h "$zip" | cut -f1)，sha256 \`$sha\`
          - 安装：在管理器里刷入 zip（APatch / Magisk / KernelSU）；**首次安装要重启一次**，升级安装刷完即生效
          - 升级时运行体在 \`/data/adb/ag2a/rt/\` 立即换新；两个按钮的面板入口需重启一次才换成新版

          上游：[aimod-cc/agent2api](https://github.com/aimod-cc/agent2api)（MIT）
          EOF
          # 上游长期只有 beta/rc，我们不宣称「稳定版」：所有包一律 pre-release，
          # 因此不会占用 Latest（Latest 永为空，用户按 Release 页的日期取最新）。
          gh release create "v$V" "$zip" --title "$V" --notes-file notes.md --prerelease

      - name: 写 update.json + 记账（UPSTREAM）
        if: steps.up.outputs.skip != '1'
        env:
          UP: ${{ steps.up.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          zip="publish/Agent2API-Magisk-v${V}.zip"
          # 管理器（Magisk / KernelSU / APatch）靠 module.prop 的 updateJson 拉这个文件，
          # 比较其中的 versionCode 决定是否显示「更新」。所以两者必须永远指向同一个 zip。
          # version / versionCode 直接从打好的包里读，杜绝手抄错位。
          ver=$(unzip -p "$zip" module.prop | sed -n 's/^version=//p' | cut -d' ' -f1)
          vc=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p')
          cat > update.json <<EOF
          {
            "version": "$ver",
            "versionCode": $vc,
            "zipUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${V}/$(basename "$zip")",
            "changelog": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          }
          EOF
          echo "$UP" > UPSTREAM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPSTREAM update.json
          # 上游没变时（force 出包）UPSTREAM 可能没 diff，但 update.json 一定变了；
          # 两个都没变才跳过，别让 git commit 以 1 退出
          if git diff --cached --quiet; then
            echo "UPSTREAM / update.json 都没变，跳过提交"
            exit 0
          fi
          git commit -m "chore: 发布 v$V（上游 $UP）"
          git push

      - name: 没有新版
        if: steps.up.outputs.skip == '1'
        run: echo "上游仍是 ${{ steps.up.outputs.tag }}，跳过。要强制出包请勾 force。"
