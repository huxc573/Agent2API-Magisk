<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent2API</title>
<style>
  :root{color-scheme:dark light;--bg:#0f1115;--fg:#e6e8ec;--dim:#8b93a1;--btn:#2f6fed;--btn2:#1b2029;--line:#252a33;--warn:#e0a33e;--ok:#3fb950}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1a1d22;--dim:#6b7280;--btn2:#e9edf3;--line:#e3e6eb;--warn:#9a6b12;--ok:#1a7f37}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;
       padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
  .card{width:100%;max-width:440px}
  h1{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 16px}
  .box{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:0 0 16px}
  .row{display:flex;align-items:baseline;gap:10px;padding:3px 0}
  .k{color:var(--dim);font-size:12px;flex:0 0 52px}
  .v{font-size:13px;word-break:break-all;flex:1}
  code{background:var(--btn2);padding:1px 5px;border-radius:5px;font-size:12.5px;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
  a.b,button.b{display:block;width:100%;padding:13px 16px;margin:0 0 10px;border:0;border-radius:12px;
       font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
  a.b{background:var(--btn);color:#fff}
  button.b{background:var(--btn2);color:var(--fg)}
  .btnrow{display:flex;gap:10px;margin:0 0 10px}
  .btnrow>button{flex:1;margin:0;padding:13px 6px;font-size:14px}
  .btnrow>button.danger{color:var(--warn)}
  button.b[disabled]{opacity:.55;cursor:default}
  pre.log{margin:6px 0 0;padding:8px 10px;border-radius:9px;background:var(--btn2);color:var(--dim);
          font:11.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;
          max-height:168px;overflow:auto}
  .tip{color:var(--dim);font-size:12px;margin:14px 0 0;line-height:1.75}
  .warn{color:var(--warn)}
  .ok{color:var(--ok)}
  .dim{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h1>Agent2API</h1>
  <p class="sub">OpenAI 兼容网关 · 手机本地运行</p>

  <div class="box">
    <div class="row"><span class="k">面板</span><span class="v"><code id="url">正在读取…</code></span></div>
    <div class="row"><span class="k">状态</span><span class="v" id="state">—</span></div>
    <div class="row"><span class="k">版本</span><span class="v"><code id="ver">—</code> <span class="dim" id="rt"></span></span></div>
    <div class="row"><span class="k">更新</span><span class="v" id="upd">检查中…</span></div>
  </div>

  <a class="b" id="go" href="#">打开面板</a>
  <div class="btnrow">
    <button class="b" id="restart" type="button">重启进程</button>
    <button class="b danger" id="stop" type="button">停止进程</button>
  </div>
  <button class="b" id="br" type="button">用浏览器打开</button>
  <button class="b" id="rel" type="button">打开 GitHub 更新地址</button>

  <div class="box" style="margin-top:4px">
    <div class="row"><span class="k">日志</span>
      <span class="v dim">run.log 尾部 <button id="lg" type="button"
        style="float:right;border:0;background:none;color:var(--btn);font:inherit;padding:0;cursor:pointer">刷新</button></span></div>
    <pre class="log" id="log">读取中…</pre>
  </div>

  <p class="tip" id="tip">&nbsp;</p>
</div>
<script>
(function () {
  // 端口/版本从模块数据目录读（KernelSU / APatch 的 WebUI 都注入 ksu 全局对象）；
  // Magisk 原生没有 WebView，读不到就按默认端口走，按钮照样能用。
  function sh(cmd) {
    try {
      var k = (typeof ksu !== 'undefined' && ksu) ? ksu : (window.apatch || null);
      if (!k || typeof k.exec !== 'function') return null;
      var r = k.exec(cmd);
      if (r && typeof r === 'object') {
        var o = (r.stdout != null) ? r.stdout : ((r.result != null) ? r.result : null);
        return (o == null) ? null : String(o);
      }
      return (r == null) ? null : String(r);
    } catch (e) { return null; }
  }
  function digits(s) { return (s || '').replace(/[^0-9]/g, ''); }

  // 仓库地址由 build_module.py 按 $AG2A_SELF_REPO 注入（CI 传 ${{ github.repository }}）
  var REPO = '__AG2A_REPO__';
  var REL = 'https://github.com/' + REPO + '/releases';
  // 更新源与 module.prop 的 updateJson 保持一致：优先 GitHub Pages（直连 1~2 秒），
  // 万一 Pages 没部署好再试 gh-proxy + raw（多一跳，慢且可能被判超时）。
  var PAGES = '__AG2A_PAGES__';
  var UPD = ['https://' + PAGES + '/update.json',
             'https://gh-proxy.com/https://raw.githubusercontent.com/' + REPO + '/main/update.json'];

  // ---------- 端口 ----------
  var PORT = 3065, raw = sh('cat /data/adb/ag2a/port');
  var n = raw ? digits(raw).slice(0, 5) : '';
  if (n && +n >= 1024 && +n <= 65535) { PORT = +n; } else { raw = null; }
  var url = 'http://127.0.0.1:' + PORT + '/';
  document.getElementById('url').textContent = url;
  document.getElementById('go').href = url;

  // ---------- 模块版本 / 运行体 / 进程 ----------
  // 抽成函数：点「重启进程 / 停止进程」之后要重新读一遍，不然面板还显示旧状态。
  var MOD = '/data/adb/modules/ag2a';
  var mver = '', mcode = '', cur = '';
  function refreshState() {
    mver = (sh("sed -n 's/^version=//p' " + MOD + '/module.prop') || '').trim();
    mcode = digits(sh("sed -n 's/^versionCode=//p' " + MOD + '/module.prop'));
    var rcode = digits(sh('cat /data/adb/ag2a/rt/.rtver'));
    cur = mver.split(' ')[0] || '';
    document.getElementById('ver').textContent = mver || '读取不到';

    var pid = digits(sh('pidof agent2api-server')) || digits(sh('pgrep -f agent2api-server'));
    document.getElementById('state').innerHTML = pid
      ? '<span class="ok">运行中</span> <span class="dim">pid ' + pid + '</span>'
      : '<span class="warn">未运行</span> <span class="dim">— 看下面的日志；点上面「重启进程」或回上一页点「执行」</span>';

    document.getElementById('rt').textContent =
      (mcode && rcode && mcode !== rcode) ? '· 运行体未同步（点「执行」或重启）' : '';
    readLog();
  }
  refreshState();

  // ---------- 更新检查 ----------
  // 读仓库里的 update.json —— 与管理器里「更新」按钮同一个数据源，比对 versionCode
  var upd = document.getElementById('upd');
  function probe(i) {
    if (i >= UPD.length) {
      upd.innerHTML = '<span class="dim">网络不通，点下面 Releases 自己看</span>';
      return;
    }
    var x = new XMLHttpRequest();
    x.open('GET', UPD[i], true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status !== 200) { probe(i + 1); return; }
      var j;
      try { j = JSON.parse(x.responseText); } catch (e) { probe(i + 1); return; }
      var rv = String(j.version || ''), rc = +j.versionCode || 0;
      if (!rc) { probe(i + 1); return; }
      if (!mcode) { upd.innerHTML = '<span class="dim">本机版本读不到，最新 ' + rv + '</span>'; return; }
      upd.innerHTML = rc > +mcode
        ? '<span class="warn">有新版 ' + rv + '</span> <span class="dim">（本机 ' + cur + '）</span>'
        : '<span class="ok">已是最新</span> <span class="dim">' + rv + '</span>';
    };
    x.onerror = x.ontimeout = function () { probe(i + 1); };
    x.send();
  }
  probe(0);

  // ---------- 按钮 ----------
  function openUrl(u) {
    if (sh('am start -a android.intent.action.VIEW -d ' + u) === null) window.open(u, '_blank');
  }

  // 重启 / 停止：直接调模块自带脚本。restart 会等到端口真的 LISTEN 才返回（最长约 15 秒），
  // 面板是同步执行，所以先把按钮置灰让用户看到「正在…」，再执行。
  function runJob(btn, busyText, cmd) {
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = busyText;
    setTimeout(function () {
      var out = sh(cmd);
      setTimeout(function () {
        btn.disabled = false;
        btn.textContent = old;
        refreshState();
        if (out === null) {
          document.getElementById('tip').innerHTML =
            '<span class="warn">没拿到命令返回：管理器没注入 shell 时无法操作，</span>' +
            '请在终端跑 <code>su -c \'sh ' + MOD + '/action.sh restart\'</code>。';
        }
      }, 300);
    }, 60);
  }
  document.getElementById('restart').addEventListener('click', function () {
    runJob(this, '重启中…', 'sh ' + MOD + '/action.sh restart');
  });
  document.getElementById('stop').addEventListener('click', function () {
    if (!window.confirm('停止网关进程？停止后面板地址会打不开，需要再点「重启进程」恢复。')) return;
    runJob(this, '停止中…', 'sh ' + MOD + '/action.sh stop');
  });
  document.getElementById('br').addEventListener('click', function () { openUrl(url); });
  document.getElementById('rel').addEventListener('click', function () { openUrl(REL); });

  // ---------- 日志 ----------
  // 起不来时唯一有信息量的地方：watchdog 把网关的 stdout/stderr 直接写进 run.log。
  // 过滤掉 [watchdog] 那几句「重拉中」，只留网关自己的报错。
  function readLog() {
    var lg = document.getElementById('log');
    var t = sh('tail -n 40 /data/adb/ag2a/run.log');
    if (t == null) { lg.textContent = '读不到日志（管理器没注入 shell 时正常）'; return; }
    var lines = String(t).split('\n').filter(function (l) {
      return l.trim() && l.indexOf('[watchdog]') < 0;
    });
    lg.textContent = lines.length ? lines.slice(-10).join('\n') : '（暂无日志）';
    lg.scrollTop = lg.scrollHeight;
  }
  readLog();
  document.getElementById('lg').addEventListener('click', readLog);

  document.getElementById('tip').innerHTML = (raw === null)
    ? '读不到模块配置，按默认端口 ' + PORT + ' 打开；改过端口就用命令行 <code>sh action.sh open</code>。'
    : '面板首次打开是「创建管理员」页；同网段电脑访问 <code>http://&lt;手机IP&gt;:' + PORT + '/</code>。<br>' +
      '升级＝管理器里刷 Releases 最新 zip；管理器的「更新」提示读的也是同一个 <code>update.json</code>。';
})();
</script>
</body>
</html>
