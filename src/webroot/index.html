<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent2API 面板</title>
<style>
  :root{color-scheme:dark light;--bg:#0f1115;--fg:#e6e8ec;--dim:#8b93a1;--btn:#2f6fed;--btn2:#1b2029;--line:#252a33}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1a1d22;--dim:#6b7280;--btn2:#e9edf3;--line:#e3e6eb}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;
       padding:calc(28px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
               calc(28px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
  .card{width:100%;max-width:420px}
  h1{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .u{margin:0 0 20px;color:var(--dim);font-size:13px;word-break:break-all;
     border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
  a.b,button.b{display:block;width:100%;padding:13px 16px;margin:0 0 10px;border:0;border-radius:12px;
       font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
  a.b{background:var(--btn);color:#fff}
  button.b{background:var(--btn2);color:var(--fg)}
  .tip{color:var(--dim);font-size:12px;margin:16px 0 0;line-height:1.75}
  code{background:var(--btn2);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <h1>Agent2API</h1>
  <p class="u" id="u">正在定位网关…</p>
  <a class="b" id="go" href="#">打开面板</a>
  <button class="b" id="br" type="button">用浏览器打开</button>
  <p class="tip" id="tip">&nbsp;</p>
</div>
<script>
(function () {
  // 端口从 /data/adb/ag2a/port 读（KernelSU / APatch 的 WebUI 都注入 ksu 全局对象）；
  // 没有这个对象就是 Magisk 原生环境，读不到，按默认 3065 走。
  function sh(cmd) {
    try {
      var k = (typeof ksu !== 'undefined' && ksu) ? ksu : (window.apatch || null);
      if (!k || typeof k.exec !== 'function') return null;
      var r = k.exec(cmd);
      if (r && typeof r === 'object') {
        var o = (r.stdout != null) ? r.stdout : ((r.result != null) ? r.result : null);
        return (o == null) ? null : String(o);
      }
      return (r == null) ? null : String(r);
    } catch (e) { return null; }
  }

  var PORT = 3065;
  var raw = sh('cat /data/adb/ag2a/port');
  var n = raw ? raw.replace(/[^0-9]/g, '').slice(0, 5) : '';
  // 读到了但不合法（空文件、垃圾内容）按「读不到」处理，提示才说得准
  if (n && +n >= 1024 && +n <= 65535) { PORT = +n; } else { raw = null; }

  var url = 'http://127.0.0.1:' + PORT + '/';
  document.getElementById('u').textContent = url;
  document.getElementById('go').href = url;
  document.getElementById('tip').innerHTML = (raw === null)
    ? '读不到模块配置，按默认端口 ' + PORT + ' 打开。改过端口的话用命令行：<code>sh action.sh open</code>'
    : '网关没起来时这里会打不开 —— 回上一页点「执行」按钮重启网关，再点「打开」。';

  document.getElementById('br').addEventListener('click', function () {
    if (sh('am start -a android.intent.action.VIEW -d ' + url) === null) window.open(url, '_blank');
  });

  // 稍等一下再跳：万一这台机器拦了跳转，上面的按钮还留在屏幕上能用
  setTimeout(function () { location.replace(url); }, 400);
})();
</script>
</body>
</html>
